<main>
  <section class="section container">
    <div class="contact-wrap">
      <div class="contact-intro">
        <h1>언제든 편하게<br>연락 주세요.</h1>
        <p>궁금하신 점이나 제휴 문의는 아래 연락처로 남겨주시면 빠르게 확인 후 답변드리겠습니다.</p>
      </div>

      <div class="contact-card">
        <div class="contact-row r1">
          <div class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"></path>
              <path d="M5 21V9l7-5 7 5v12"></path>
              <path d="M9 21v-6h6v6"></path>
            </svg>
          </div>
          <div>
            <div class="label">회사명</div>
            <div class="value">와이제이더블유 컴퍼니</div>
          </div>
        </div>

        <div class="contact-row r2">
          <div class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21Z"></path>
              <circle cx="12" cy="9.5" r="2.4"></circle>
            </svg>
          </div>
          <div>
            <div class="label">주소</div>
            <div class="value">서울 송파구 가락로 244, 3층 305-88호</div>
          </div>
        </div>

        <div class="contact-row r3">
          <div class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </div>
          <div>
            <div class="label">이메일</div>
            <a class="value" href="mailto:info@yjwco.kr">info@yjwco.kr</a>
          </div>
        </div>

        <div class="contact-row r4">
          <div class="icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"></path>
            </svg>
          </div>
          <div>
            <div class="label">전화번호</div>
            <a class="value" href="tel:07080647581">070-8064-7581</a>
          </div>
        </div>
      </div>
    </div>
